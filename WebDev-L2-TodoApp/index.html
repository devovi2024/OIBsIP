<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | To-Do App</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-shell">
        <!-- HEADER -->
        <header>
            <div>
                <h1><i class="fas fa-list-check"></i> TaskFlow</h1>
                <p class="subtitle">Stay organized. Stay productive.</p>
            </div>
            <label class="theme-toggle" for="theme-check">
                <span><i class="fas fa-sun"></i></span>
                <input id="theme-check" type="checkbox" />
                <span class="switch"></span>
            </label>
        </header>

        <!-- ADD TASK -->
        <section class="add-task">
            <input type="text" id="task-input" placeholder="What do you need to do?" />
            <button id="add-btn"><i class="fas fa-plus"></i> Add Task</button>
        </section>

        <!-- LISTS -->
        <main class="lists">
            <!-- Pending -->
            <section class="list-section">
                <div class="list-header">
                    <h2><i class="fas fa-clock"></i> Pending</h2>
                    <span class="count" id="pending-count">0</span>
                </div>
                <ul id="pending-list" class="task-list"></ul>
                <p class="empty-state" id="empty-pending">✨ Nothing pending! Enjoy your break.</p>
            </section>

            <!-- Completed -->
            <section class="list-section">
                <div class="list-header">
                    <h2><i class="fas fa-check-circle"></i> Completed</h2>
                    <span class="count" id="completed-count">0</span>
                </div>
                <ul id="completed-list" class="task-list"></ul>
                <p class="empty-state" id="empty-completed">🏆 No completed tasks yet. Start crushing your goals!</p>
            </section>
        </main>

        <!-- FOOTER -->
        <footer>
            <i class="fas fa-copyright"></i> <span id="year"></span> TaskFlow | Stay productive, stay inspired.
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
