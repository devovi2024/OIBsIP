<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium, interactive calculator with history and keyboard support." />
    <title>Calculator | Precision, reimagined</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app-shell">
        <!-- HEADER & THEME TOGGLE -->
        <header>
            <div class="brand">
                <h1><i class="fas fa-calculator"></i> Calculator</h1>
            </div>
            <label class="theme-toggle" for="theme-check">
                <span><i class="fas fa-sun"></i> Light</span>
                <input id="theme-check" type="checkbox" aria-label="Toggle light mode" />
                <span class="switch" role="switch" aria-hidden="true"></span>
            </label>
        </header>

        <!-- MAIN CALCULATOR AREA -->
        <main>
            <!-- CALCULATOR CARD -->
            <section class="calculator" aria-label="Calculator">
                <!-- Display Screen -->
                <div class="display" aria-live="polite">
                    <p class="expression" id="expression">0</p>
                    <p class="result" id="result">0</p>
                </div>

                <!-- Keypad Grid -->
                <div class="keypad" aria-label="Calculator keypad">
                    <!-- Row 1: Utilities -->
                    <button class="key utility" data-action="clear" aria-label="Clear"><i class="fas fa-times"></i></button>
                    <button class="key" data-action="negate" aria-label="Negate"><i class="fas fa-plus-minus"></i></button>
                    <button class="key" data-action="percent" aria-label="Percentage"><i class="fas fa-percent"></i></button>
                    <button class="key operator" data-value="÷" aria-label="Divide"><i class="fas fa-divide"></i></button>

                    <!-- Row 2 -->
                    <button class="key" data-value="7">7</button>
                    <button class="key" data-value="8">8</button>
                    <button class="key" data-value="9">9</button>
                    <button class="key operator" data-value="×" aria-label="Multiply"><i class="fas fa-times"></i></button>

                    <!-- Row 3 -->
                    <button class="key" data-value="4">4</button>
                    <button class="key" data-value="5">5</button>
                    <button class="key" data-value="6">6</button>
                    <button class="key operator" data-value="−" aria-label="Subtract"><i class="fas fa-minus"></i></button>

                    <!-- Row 4 -->
                    <button class="key" data-value="1">1</button>
                    <button class="key" data-value="2">2</button>
                    <button class="key" data-value="3">3</button>
                    <button class="key operator" data-value="+" aria-label="Add"><i class="fas fa-plus"></i></button>

                    <!-- Row 5 -->
                    <button class="key zero" data-value="0">0</button>
                    <button class="key" data-value=".">.</button>
                    <button class="key equals" data-action="equals" aria-label="Equals"><i class="fas fa-equals"></i></button>
                </div>
            </section>

            <!-- HISTORY PANEL -->
            <aside class="history-panel" id="history-panel">
                <button class="history-button" id="history-toggle" aria-expanded="false">
                    <span><i class="fas fa-clock-rotate-left"></i> History</span>
                    <span aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
                </button>
                <ul class="history-list" id="history-list">
                    <li class="empty-history"><i class="fas fa-inbox"></i> Your completed calculations will appear here.</li>
                </ul>
            </aside>
        </main>

   
    </div>

    <script src="script.js"></script>
</body>
</html>
